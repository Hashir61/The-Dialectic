<section class="engagement" id="engagement" aria-label="Likes and comments">
<style>
.engagement {
  position: relative; left: 50%; transform: translateX(-50%);
  width: min(56rem, 94vw); box-sizing: border-box;
  margin: 3rem 0 2rem; padding-top: 1.75rem;
  border-top: 1px solid rgba(128,128,128,.35); text-align: left;
}
.engagement .like-btn {
  display: inline-flex; align-items: center; gap: .6rem;
  padding: .55rem 1.2rem; border: 1px solid currentColor;
  border-radius: 999px; background: transparent; color: inherit;
  font: inherit; cursor: pointer; opacity: .8;
  transition: opacity .15s ease, background-color .15s ease;
}
.engagement .like-btn:hover:not(:disabled) { opacity: 1; }
.engagement .like-btn:disabled { cursor: default; }
.engagement .like-btn[aria-pressed="true"] { opacity: 1; background: rgba(128,128,128,.15); }
.engagement .like-icon { display: block; }
.engagement .like-icon path {
  fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;
}
.engagement .like-btn[aria-pressed="true"] .like-icon path { fill: currentColor; }
.engagement .like-count { font-variant-numeric: tabular-nums; min-width: 1ch; }
.engagement .engagement-title { margin: 2.25rem 0 1rem; }
</style>
<div class="engagement-likes">
<button type="button" class="like-btn" id="like-btn" aria-pressed="false">
  <svg class="like-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path d="M7 22V11M2 13v7a2 2 0 0 0 2 2h11.28a2 2 0 0 0 1.96-1.6l1.54-7A2 2 0 0 0 16.82 11H14V7a3 3 0 0 0-3-3 1 1 0 0 0-1 1v.57L7.12 11"/>
  </svg>
  <span class="like-label">Like</span>
  <span class="like-count" id="like-count" aria-live="polite">0</span>
</button>
</div>
<h3 class="engagement-title">Discussion</h3>
<div id="giscus-mount"></div>
<script src="{{ '/assets/js/engagement.js' | relative_url }}" defer></script>
</section>
