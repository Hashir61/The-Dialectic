<section class="engagement" id="engagement" aria-label="Likes and comments">
<style>
.engagement {
  position: relative; left: 50%; transform: translateX(-50%);
  width: min(56rem, 94vw); box-sizing: border-box;
  margin: 3rem 0 2rem; padding-top: 1.75rem;
  border-top: 1px solid rgba(128,128,128,.35);
  text-align: left;
}
.engagement .like-btn {
  display: inline-flex; align-items: center; gap: .6rem;
  padding: .55rem 1.2rem;
  border: 1px solid currentColor; border-radius: 999px;
  background: transparent; color: inherit; font: inherit;
  cursor: pointer; opacity: .8;
  transition: opacity .15s ease, background-color .15s ease;
}
.engagement .like-btn:hover:not(:disabled) { opacity: 1; }
.engagement .like-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.engagement .like-btn:disabled { cursor: default; }
.engagement .like-btn[aria-pressed="true"] {
  opacity: 1;
  background: rgba(128,128,128,.15);
}
.engagement .like-icon { display: block; }
.engagement .like-icon path {
  fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;
}
.engagement .like-btn[aria-pressed="true"] .like-icon path { fill: currentColor; }
.engagement .like-count { font-variant-numeric: tabular-nums; min-width: 1ch; }
.engagement .engagement-title { margin: 2.25rem 0 1rem; }
.engagement .engagement-note { opacity: .7; font-size: .9em; }
</style>
<div class="engagement-likes">
<button type="button" class="like-btn" id="like-btn" aria-pressed="false">
  <svg class="like-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path d="M7 22V11M2 13v7a2 2 0 0 0 2 2h11.28a2 2 0 0 0 1.96-1.6l1.54-7A2 2 0 0 0 16.82 11H14V7a3 3 0 0 0-3-3 1 1 0 0 0-1 1v.57L7.12 11"/>
  </svg>
  <span class="like-label">Like</span>
  <span class="like-count" id="like-count" aria-live="polite">0</span>
</button>
</div>
<h3 class="engagement-title">Discussion</h3>
<div id="giscus-mount"></div>
<script type="module">
const CONFIG = {
  firebase: {
    apiKey: "REPLACE_ME",
    authDomain: "REPLACE_ME",
    projectId: "REPLACE_ME",
    appId: "REPLACE_ME"
  },
  giscus: {
    repo: "hashir61/The-Dialectic",
    repoId: "R_kgDOUmPXDg",
    category: "General",
    categoryId: "DIC_kwDOUmPXDs4DGjls"
  }
};
const postId = "{{ page.url | slugify }}" || "home";
const box = document.getElementById("engagement");
const btn = document.getElementById("like-btn");
const countEl = document.getElementById("like-count");
const labelEl = btn.querySelector(".like-label");
const mount = document.getElementById("giscus-mount");
const notSet = (o) => Object.values(o).some((v) => String(v).includes("REPLACE_ME"));

const footnotes = document.querySelector(".footnotes");
if (box && footnotes) footnotes.insertAdjacentElement("afterend", box);

function getTheme() {
  const stored = document.documentElement.getAttribute("data-theme");
  if (stored === "dark") return "dark";
  if (stored === "light") return "light";
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function sendGiscusTheme(theme) {
  const frame = document.querySelector("iframe.giscus-frame");
  if (!frame) return;
  frame.contentWindow.postMessage(
    { giscus: { setConfig: { theme: theme === "dark" ? "dark" : "light" } } },
    "https://giscus.app"
  );
}
new MutationObserver(() => sendGiscusTheme(getTheme()))
  .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", () => sendGiscusTheme(getTheme()));

const likedKey = "liked:" + postId;
const localCountKey = "likes-local:" + postId;
let liked = false;
try { liked = localStorage.getItem(likedKey) === "1"; } catch (e) {}

function render(n) {
  countEl.textContent = n;
  btn.setAttribute("aria-pressed", String(liked));
  btn.disabled = liked;
  labelEl.textContent = liked ? "Liked" : "Like";
}

let remote = null;
if (!notSet(CONFIG.firebase)) {
  try {
    const v = "10.12.2";
    const [appMod, fs] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/" + v + "/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/" + v + "/firebase-firestore.js")
    ]);
    const app = appMod.initializeApp(CONFIG.firebase);
    const db = fs.getFirestore(app);
    remote = { fs, ref: fs.doc(db, "likes", postId) };
  } catch (e) { console.warn("Likes: Firebase failed to load, using local count.", e); }
}

async function readCount() {
  if (remote) {
    try {
      const snap = await remote.fs.getDoc(remote.ref);
      return snap.exists() ? (snap.data().count || 0) : 0;
    } catch (e) { console.warn("Likes: read failed.", e); }
  }
  try { return parseInt(localStorage.getItem(localCountKey) || "0", 10); } catch (e) { return 0; }
}

let current = await readCount();
render(current);

btn.addEventListener("click", async () => {
  if (liked) return;
  liked = true;
  current += 1;
  render(current);
  try { localStorage.setItem(likedKey, "1"); } catch (e) {}
  if (remote) {
    try { await remote.fs.setDoc(remote.ref, { count: remote.fs.increment(1) }, { merge: true }); }
    catch (e) { console.warn("Likes: write failed.", e); }
  } else {
    try { localStorage.setItem(localCountKey, String(current)); } catch (e) {}
  }
});

if (notSet(CONFIG.giscus)) {
  const p = document.createElement("p");
  p.className = "engagement-note";
  p.textContent = "Comments are not configured yet.";
  mount.appendChild(p);
} else {
  const s = document.createElement("script");
  s.src = "https://giscus.app/client.js";
  const attrs = {
    "data-repo": CONFIG.giscus.repo,
    "data-repo-id": CONFIG.giscus.repoId,
    "data-category": CONFIG.giscus.category,
    "data-category-id": CONFIG.giscus.categoryId,
    "data-mapping": "pathname",
    "data-strict": "0",
    "data-reactions-enabled": "0",
    "data-emit-metadata": "0",
    "data-input-position": "top",
    "data-theme": getTheme(),
    "data-lang": "en"
  };
  Object.keys(attrs).forEach((k) => s.setAttribute(k, attrs[k]));
  s.crossOrigin = "anonymous";
  s.async = true;
  mount.appendChild(s);
}
</script>
</section>
