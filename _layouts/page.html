---
layout: default
---
{%- if page.hero_image %}
<section class="section-hero">
  <img class="section-hero-art" src="{{ page.hero_image | relative_url }}" alt="{{ page.hero_alt | escape }}">
  <div class="section-hero-scrim" aria-hidden="true"></div>
  <div class="section-hero-inner wrap">
    <h1 class="section-hero-title">{{ page.title | escape }}</h1>
  </div>
  {%- if page.hero_credit %}<p class="section-hero-credit">{{ page.hero_credit | escape }}</p>{% endif %}
</section>
<article class="plain-page">
  <div class="prose no-dropcap wrap-text">{{ content }}</div>
</article>
{%- else %}
<article class="plain-page">
  <header class="page-head wrap-text">
    <h1 class="page-title display">{{ page.title | escape }}</h1>
  </header>
  <div class="prose no-dropcap wrap-text">{{ content }}</div>
</article>
{%- endif %}
